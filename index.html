<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>HUTICHA LÂM THAO</title>
<style>
:root{--navy:#071B3A;--gold:#F5C542;--cream:#fff8df}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#071B3A}header{background:var(--navy);padding:12px 5%;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;color:white;font-weight:bold;font-size:24px}.logo img{height:60px;margin-right:15px;border-radius:50%}.logo span{color:var(--gold)}nav a{color:white;margin:0 10px;text-decoration:none;font-weight:bold}.hero{margin:30px auto;max-width:1200px;background:linear-gradient(110deg,var(--navy),#12345d);border-radius:25px;padding:60px;color:white;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:48px}.hero h1 span{color:var(--gold)}button{background:var(--gold);border:0;border-radius:30px;padding:15px 30px;font-weight:bold;color:var(--navy)}.card{background:white;border-radius:20px;padding:20px;margin:20px}.gold{color:var(--gold)}footer{background:var(--navy);color:white;padding:30px;text-align:center}@media(max-width:700px){.hero{display:block}.hero h1{font-size:34px}nav{display:none}}

</head>
<body>
<header><div class="logo"><img src="logo.png" alt="HUTICHA">HUTICHA <span>LÂM THAO</span></div><nav><a href="#">Trang chủ</a><a href="#">Đồ uống</a><a href="#">Đồ ăn</a><a href="#">Liên hệ</a></nav></header>

<div class="card"><h2 class="gold">Sản phẩm nổi bật</h2><p>Trà sữa, cà phê, đồ ăn nhẹ và combo hấp dẫn.</p></div>
<footer>HUTICHA LÂM THAO - Ngon từ tâm</footer>
</body></html>
